<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Adivina la canción</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-url="{{ URL }}" data-qr="{{ QR }}">
  <button id="mode-toggle">🌙 Dark/Light</button>

  <h2>🎧 Adivina la canción</h2>

  <div id="registro">
    <p>Introduce tu nombre:</p>
    <input type="text" id="nombre">
    <button onclick="registrarse()">Entrar</button>
  </div>

  <div id="juego" style="display:none;">
    <div id="qr-contenedor" style="display:none;">
      <div>
        <p><b>📡 Dirección para unirse:</b><br><br><code id="url"></code></p>
      </div>
      <img id="qr" src="" width="120">
    </div>

    <h3 id="bienvenida"></h3>

    <div id="panel_host" style="display:none;">
      <button onclick="nuevaRonda()">▶️ Nueva Ronda</button>
      <button onclick="mostrarFinal()">❌ Terminar partida</button>
      <h4>Jugadores:</h4>
      <pre id="puntuaciones">Cargando...</pre>
    </div>

    <p id="estado">Esperando que empiece la ronda...</p>
    <p><b>Tiempo restante:</b> <span id="temporizador">--</span></p>

    <div id="panel_jugador">
      <input type="text" id="respuesta" placeholder="Tu respuesta">
      <button onclick="enviarRespuesta()">Enviar</button>
      <button onclick="solicitarTiempo()">🕒 Solicitar +30s</button>
      <p id="resultado"></p>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div id="modal-content">
      <h2>🎉 ¡Partida Terminada!</h2>
      <pre id="final-scores">Cierra esto, me da pereza quitarlo :)</pre>
      <button id="close-modal">Cerrar</button>
    </div>
  </div>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
