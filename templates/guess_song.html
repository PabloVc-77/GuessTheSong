<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Adivina la canción</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <button id="mode-toggle">🌙 Dark/Light</button>

  <h2>🎧 Adivina la canción</h2>

  <div id="registro">
    <p>Introduce tu nombre:</p>
    <input type="text" id="nombre">
    <button onclick="registrarse()">Entrar</button>
  </div>

  <div id="juego" style="display:none;">
    <h3 id="bienvenida"></h3>

    <p id="estado">Esperando que empiece la ronda...</p>
    <p><b>Tiempo restante:</b> <span id="temporizador">--</span></p>

    <div id="panel_jugador">
      <input type="text" id="respuesta" placeholder="Tu respuesta">
      <button onclick="enviarRespuesta()">Enviar</button>
      <button onclick="solicitarTiempo()">🕒 Solicitar +30s</button>
      <p id="resultado"></p>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div id="modal-content">
      <h2>🎉 ¡Ronda terminada!</h2>
      <pre id="final-scores"></pre>
      <button id="close-modal">Cerrar</button>
    </div>
  </div>
  <script src="{{ url_for('static', filename='guess_song.js') }}"></script>
</body>
</html>
